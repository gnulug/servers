# Public, anonymous, read-only mirrors.
motd file = /etc/rsyncd.motd
pid file = /run/rsyncd.pid
lock file = /run/rsyncd.lock
log file = /dev/stdout
max connections = 25
timeout = 600

[archlinux]
    path = /ext/mirrors/archlinux
    comment = Arch Linux package mirror
    read only = yes
    list = yes
    use chroot = yes
    uid = nobody
    gid = nobody
