name: rsync

services:
  rsync:
    container_name: rsync
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "873:873"
    volumes:
      - ./rsyncd.conf:/etc/rsyncd.conf:ro
      - ./rsyncd.motd:/etc/rsyncd.motd:ro
      - ../../volumes/arch-mirror:/ext/mirrors/archlinux:ro
    read_only: true
    tmpfs:
      - /run
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
